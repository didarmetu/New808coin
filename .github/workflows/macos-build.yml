name: macOS Universal Build

on:
  workflow_dispatch:
  push:
    branches:
      - macos-universal

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-15

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Show build environment
        run: |
          uname -a
          uname -m
          xcodebuild -version
          clang++ --version
          brew --version

      - name: Install dependencies
        run: |
          brew update
          brew install \
            autoconf \
            automake \
            libtool \
            pkg-config \
            boost \
            openssl@3.5 \
            libevent \
            zeromq \
            miniupnpc \
            qt@5 \
            protobuf@21 \
            qrencode \

      - name: Build Berkeley DB 4.8
        run: |
          BDB_SOURCE="$RUNNER_TEMP/bdb-source"
          BDB_PREFIX="$RUNNER_TEMP/bdb48"

          mkdir -p "$BDB_SOURCE" "$BDB_PREFIX"
          cd "$BDB_SOURCE"

          curl --location --fail             --output db-4.8.30.NC.tar.gz             https://download.oracle.com/berkeley-db/db-4.8.30.NC.tar.gz

          echo "12edc0df75bf9abd7f82f821795bcee50f42cb2e5f76a6a281b85732798364ef  db-4.8.30.NC.tar.gz"             | shasum -a 256 -c -

          tar -xzf db-4.8.30.NC.tar.gz
          cd db-4.8.30.NC

          sed -i.bak             's/__atomic_compare_exchange/__atomic_compare_exchange_db/g'             dbinc/atomic.h

          sed -i.bak             's/atomic_init/atomic_init_db/g'             dbinc/atomic.h             mp/mp_region.c             mp/mp_mvcc.c             mp/mp_fget.c             mutex/mut_method.c             mutex/mut_tas.c

          cd build_unix

          CFLAGS="-Wno-error=implicit-function-declaration" ../dist/configure             --prefix="$BDB_PREFIX"             --enable-cxx             --disable-shared             --disable-replication

          make -j"$(sysctl -n hw.logicalcpu)"
          make install

      - name: Configure environment
        run: |
          BREW_PREFIX="$(brew --prefix)"
          QT_PREFIX="$(brew --prefix qt@5)"
          OPENSSL_PREFIX="$(brew --prefix openssl@3.5)"
          PROTOBUF_PREFIX="$(brew --prefix protobuf@21)"
          BDB_PREFIX="$RUNNER_TEMP/bdb48"

          echo "$QT_PREFIX/bin" >> "$GITHUB_PATH"
          echo "$PROTOBUF_PREFIX/bin" >> "$GITHUB_PATH"

          echo "CPPFLAGS=-I$OPENSSL_PREFIX/include -I$BDB_PREFIX/include" >> "$GITHUB_ENV"
          echo "LDFLAGS=-L$OPENSSL_PREFIX/lib -L$BDB_PREFIX/lib" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$QT_PREFIX/lib/pkgconfig:$OPENSSL_PREFIX/lib/pkgconfig:$PROTOBUF_PREFIX/lib/pkgconfig:$BREW_PREFIX/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Generate build system
        run: ./autogen.sh

      - name: Configure
        run: |
          ./configure \
            --disable-tests \
            --with-gui=qt5 \
            --with-boost="$(brew --prefix boost)" \
            --with-boost-libdir="$(brew --prefix boost)/lib"

      - name: Compile all targets and collect diagnostics
        id: compile
        shell: bash
        run: |
          set +e
          make -k -j"$(sysctl -n hw.logicalcpu)" V=1 2>&1             | tee "macos-${{ matrix.arch }}-build.log"
          build_status=${PIPESTATUS[0]}
          echo "status=$build_status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload compile diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: new808coin-macos-${{ matrix.arch }}-diagnostics
          path: macos-${{ matrix.arch }}-build.log
          if-no-files-found: error

      - name: Stop after compile failure
        if: steps.compile.outputs.status != '0'
        run: exit 1

      - name: Show compiled architectures
        run: |
          find src -type f -perm -111 -maxdepth 3 -print
          find src -type f -perm -111 -maxdepth 3 \
            -exec file {} \;

      - name: Collect build
        run: |
          mkdir -p "macos-${{ matrix.arch }}"

          find src -type f \( \
            -name "new808coind" -o \
            -name "new808coin-cli" -o \
            -name "new808coin-tx" \
          \) -exec cp {} "macos-${{ matrix.arch }}/" \;

          if [ -d src/qt/New808coin-Qt.app ]; then
            cp -R src/qt/New808coin-Qt.app \
              "macos-${{ matrix.arch }}/"
          fi

          if [ -d src/qt/new808coin-qt.app ]; then
            cp -R src/qt/new808coin-qt.app \
              "macos-${{ matrix.arch }}/"
          fi

      - name: Upload architecture build
        uses: actions/upload-artifact@v4
        with:
          name: new808coin-macos-${{ matrix.arch }}
          path: macos-${{ matrix.arch }}
          if-no-files-found: error
